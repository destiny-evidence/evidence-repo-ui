name: Deploy to Azure

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      environment:
        type: string
        description: Environment to deploy to
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment to deploy to
        required: true
        default: staging
        options:
          - development
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_MATOMO_URL: ${{ vars.VITE_MATOMO_URL }}
          VITE_MATOMO_SITE_ID: ${{ vars.VITE_MATOMO_SITE_ID }}
          VITE_FEEDBACK_FORM_URL: ${{ vars.VITE_FEEDBACK_FORM_URL }}
          VITE_ESEA_VOCABULARY_URL: ${{ vars.VITE_ESEA_VOCABULARY_URL }}
          VITE_ESEA_CONTEXT_URL: ${{ vars.VITE_ESEA_CONTEXT_URL }}
          VITE_HPV_VOCABULARY_URL: ${{ vars.VITE_HPV_VOCABULARY_URL }}
          VITE_HPV_CONTEXT_URL: ${{ vars.VITE_HPV_CONTEXT_URL }}
          VITE_SUMMARISER_BASE: ${{ vars.VITE_SUMMARISER_BASE }}
          VITE_AI_SUMMARY_FLAG_FORM_URL: ${{ vars.VITE_AI_SUMMARY_FLAG_FORM_URL }}
          VITE_ENRICHMENT_FORM_URL: ${{ vars.VITE_ENRICHMENT_FORM_URL }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Az CLI login
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy to blob storage
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
              --destination '$web' \
              --source ./dist \
              --overwrite true

      - name: Purge Front Door cache
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az afd endpoint purge \
              --resource-group ${{ vars.FRONTDOOR_RESOURCE_GROUP }} \
              --profile-name ${{ vars.FRONTDOOR_PROFILE_NAME }} \
              --endpoint-name ${{ vars.FRONTDOOR_ENDPOINT_NAME }} \
              --domains ${{ vars.CUSTOM_DOMAIN }} \
              --content-paths "/*" \
              --no-wait

  notify:
    # Production only: pushes to main deploy to staging and stay silent.
    if: ${{ always() && inputs.environment == 'production' }}
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      STATUS: >-
        ${{ (contains(needs.*.result, 'failure') && '🚨 DEPLOY FAILED')
        || (contains(needs.*.result, 'skipped') && '🚨 DEPLOY FAILED')
        || (contains(needs.*.result, 'cancelled') && '⚠️ Deploy cancelled')
        || '✅ Deployed' }}
    steps:
      - name: Shorten commit sha
        id: commit
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of deploy result
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # The action swallows delivery errors by default; fail loudly instead.
          errors: true
          payload: |
            blocks:
              - type: header
                text:
                  type: plain_text
                  emoji: true
                  text: "${{ env.STATUS }} - ${{ github.event.repository.name }} (${{ inputs.environment }})"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.commit.outputs.short_sha }}>"
                  - type: mrkdwn
                    text: "*Triggered by:*\n${{ github.triggering_actor }}"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "${{ github.workflow }} (${{ github.ref_name }}) · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
